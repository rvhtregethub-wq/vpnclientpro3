<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">
<title>VPNCLIENTPRO3 | پنل سرورها</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#29496b;--blue:#087df0;--cyan:#19c7d8;--muted:#a9bfd7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#123e68 0,#071426 58%);font-family:Tahoma,Arial,sans-serif;color:#f4f8ff}
.wrap{max-width:1100px;margin:auto;padding:18px}
.hero{text-align:center;padding:28px 14px 22px;border:1px solid #28669a;border-radius:24px;background:linear-gradient(135deg,#12365b,#0a192d);box-shadow:0 12px 38px #001020}
.brand{font-size:clamp(25px,5vw,42px);font-weight:900;letter-spacing:1px}
.sub{color:#c2dcf4;margin-top:10px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid #315b80;border-radius:30px;padding:7px 12px;color:#d9edff;font-size:13px}
.toolbar{display:grid;grid-template-columns:1fr 210px;gap:10px;margin:18px 0 12px}
.toolbar input,.toolbar select{min-width:0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#0b1a2e;color:white;font:inherit}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}
.btn{border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(135deg,#0879ef,#13b7ce);color:white;font-weight:bold;font:inherit;cursor:pointer}
.btn.secondary{background:#1a3452;border:1px solid #355a7e}
.btn:active{transform:scale(.98)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.server{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#112945,#0b192c);padding:14px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:bold;line-height:1.8;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin:6px 0 10px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.server .btn{padding:8px 12px;font-size:13px}
.count{color:#b8d1e9;margin:8px 2px 14px;font-size:14px}
.notice{padding:18px;text-align:center;color:#c5d9ed;border:1px dashed #426384;border-radius:14px;line-height:2}
.foot{text-align:center;color:#9bb2d0;font-size:12px;padding:24px 0 8px;line-height:2}
.foot a{color:#6dd9ff;text-decoration:none}
@media(max-width:560px){.wrap{padding:12px}.toolbar{grid-template-columns:1fr}.hero{padding:22px 10px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
  <div class="brand">🚀 VPNCLIENTPRO3</div>
  <div class="sub">پنل مدیریت و دریافت کانفیگ‌های سرور</div>
  <div class="chips">
    <span class="chip">🌍 سرورهای چند کشور</span>
    <span class="chip">⚡ کپی سریع</span>
    <span class="chip">📥 دانلود TXT</span>
  </div>
</header>

<section class="toolbar">
  <input id="search" type="search" placeholder="🔎 جستجوی کشور، نام یا آدرس سرور...">
  <select id="country"><option value="">همه کشورها</option></select>
</section>

<div class="actions">
  <button class="btn" id="copyAll">📋 کپی همه کانفیگ‌ها</button>
  <button class="btn secondary" id="copySub">🔗 کپی لینک اشتراک</button>
  <button class="btn secondary" id="download">📥 دانلود فایل TXT</button>
</div>

<div class="count" id="count">در حال دریافت سرورها...</div>
<section class="list" id="list"><div class="notice">لطفاً کمی صبر کنید...</div></section>

<footer class="foot">
  کانال پشتیبانی: <a href="https://t.me/vpnclientpro3" target="_blank" rel="noopener">@vpnclientpro3</a><br>
  VPNCLIENTPRO3 · به‌روزرسانی خودکار از فایل اشتراک
</footer>
</main>

<script>
"use strict";
const SUB_URL = new URL("subscription.txt", location.href).href;
let servers = [];
const $ = id => document.getElementById(id);

function decodeBase64(text) {
  const raw = atob(text.trim());
  const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function getLabel(uri) {
  try {
    return decodeURIComponent((uri.split("#")[1] || "").replace(/\+/g, "%20"));
  } catch {
    return uri.split("#")[1] || "سرور بدون نام";
  }
}

function getCountry(label) {
  const parts = label.split("|").map(x => x.trim());
  if (parts.length >= 2) {
    const persian = parts.find(x => /[\u0600-\u06FF]/.test(x) && !x.includes("@"));
    if (persian) return persian;
    return parts[1];
  }
  return "نامشخص";
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function filteredServers() {
  const q = $("search").value.trim().toLowerCase();
  const country = $("country").value;
  return servers.filter(s =>
    (!country || s.country === country) &&
    (!q || (s.label + " " + s.uri).toLowerCase().includes(q))
  );
}

function render() {
  const rows = filteredServers();
  $("count").textContent = "نمایش " + rows.length + " از " + servers.length + " سرور";
  $("list").innerHTML = rows.length
    ? rows.map(s => `
      <article class="server">
        <div class="top"><div class="name">${escapeHtml(s.label)}</div></div>
        <div class="meta">${escapeHtml(s.uri.slice(0,95))}${s.uri.length > 95 ? "…" : ""}</div>
        <button class="btn" data-copy="${s.index}">📋 کپی کانفیگ</button>
      </article>`).join("")
    : '<div class="notice">موردی پیدا نشد.</div>';
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value);
    return true;
  } catch {
    const area = document.createElement("textarea");
    area.value = value;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    return ok;
  }
}

async function loadServers() {
  try {
    const response = await fetch(SUB_URL + "?v=" + Date.now(), {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const encoded = (await response.text()).replace(/\s/g, "");
    const decoded = decodeBase64(encoded);

    servers = decoded.split(/\r?\n/)
      .map(line => line.trim())
      .filter(line => /^(vless|vmess|trojan|ss|hy2|hysteria2|tuic):\/\//i.test(line))
      .map((uri, index) => {
        const label = getLabel(uri);
        return {uri, label, country:getCountry(label), index};
      });

    const countries = [...new Set(servers.map(s => s.country))]
      .sort((a,b) => a.localeCompare(b, "fa"));

    $("country").innerHTML = '<option value="">همه کشورها</option>' +
      countries.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    if (!servers.length) throw new Error("هیچ کانفیگ معتبری در فایل اشتراک پیدا نشد.");
    render();
  } catch (error) {
    $("count").textContent = "خطا در دریافت اطلاعات";
    $("list").innerHTML = `<div class="notice">
      فایل subscription.txt دریافت نشد یا قالب آن معتبر نیست.<br>
      ${escapeHtml(error.message)}<br>
      بررسی کنید فایل subscription.txt در شاخه اصلی مخزن باشد.
    </div>`;
  }
}

$("search").addEventListener("input", render);
$("country").addEventListener("change", render);

$("list").addEventListener("click", async event => {
  const button = event.target.closest("[data-copy]");
  if (!button) return;
  const server = servers.find(s => s.index === Number(button.dataset.copy));
  if (!server) return;
  const ok = await copyText(server.uri);
  button.textContent = ok ? "✓ کپی شد" : "کپی ناموفق";
  setTimeout(() => button.textContent = "📋 کپی کانفیگ", 1500);
});

$("copyAll").addEventListener("click", async () => {
  if (!servers.length) return;
  const ok = await copyText(servers.map(s => s.uri).join("\n"));
  $("copyAll").textContent = ok ? "✓ همه کپی شدند" : "کپی ناموفق";
  setTimeout(() => $("copyAll").textContent = "📋 کپی همه کانفیگ‌ها", 1600);
});

$("copySub").addEventListener("click", async () => {
  const ok = await copyText(SUB_URL);
  $("copySub").textContent = ok ? "✓ لینک کپی شد" : "کپی ناموفق";
  setTimeout(() => $("copySub").textContent = "🔗 کپی لینک اشتراک", 1600);
});

$("download").addEventListener("click", () => {
  const content = servers.map(s => s.uri).join("\n") + "\n";
  const blob = new Blob([content], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "VPNCLIENTPRO3-servers.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

loadServers();
</script>
</body>
</html>
